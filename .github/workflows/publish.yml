name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish (defaults to selected ref)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif node -e "const p=require('./package.json'); process.exit(p.dependencies || p.devDependencies ? 0 : 1)"; then
            npm install
          else
            echo "No dependencies to install."
          fi

      - name: Validate package
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.ci ? 0 : 1)"; then
            npm run ci
          elif node -e "process.exit(require('./package.json').scripts?.check ? 0 : 1)"; then
            npm run check
          elif node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          elif node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo "No validation script configured."
          fi

      - name: Skip already published version
        id: published
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          set +e
          output=$(npm view "${name}@${version}" version 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "${name}@${version} is already published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$output" | grep -Eq 'E404|404 Not Found'; then
            echo "Publishing ${name}@${version}."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$output" >&2
            exit "$status"
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        shell: bash
        run: |
          # DOT-917: the "Skip already published version" guard above is a
          # non-atomic check-then-publish. Two runs for the same version (for
          # example a tag push plus a release.published event) can both pass the
          # guard and race; the loser then fails with
          #   403 You cannot publish over the previously published versions: X
          # after npm registry propagation. Treat only that exact duplicate-version
          # error as success so the workflow is idempotent. Auth/permission,
          # network, tarball and every other failure still fail the job.
          # npm publish needs the same identity the guard step used; shell
          # variables do not carry between steps, so derive them again here.
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          set +e
          output=$(npm publish --access public 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$output" | grep -Eq 'cannot publish over the previously published versions'; then
            # Do not trust the message alone: confirm the version is actually
            # installable before reporting success, so a broken/unavailable
            # release is still a failure.
            set +e
            published_version=$(npm view "${name}@${version}" version 2>&1)
            published_status=$?
            set -e
            if [ "$published_status" -eq 0 ]; then
              echo "::notice::${published_version} is already published by a concurrent run; treating duplicate-version E403 as success."
              exit 0
            fi
            echo "::error::Duplicate-version E403 reported, but ${name}@${version} is not resolvable on the registry."
            printf '%s\n' "$published_version" >&2
            exit "$published_status"
          fi
          exit "$status"
